name: Build Cage for Intel Mac
on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit SHA to build
        required: true
        type: string
      release:
        description: Build signed and notarized release files after checks
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Name of the resulting workflow artifact
        required: true
        type: string
permissions:
  contents: read

jobs:
  checks:
    # The runtime is built natively; hosted runners cannot boot nested guests.
    runs-on: macos-15-intel
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the exact source and Intel runner
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Pass an exact commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ !inputs.release }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !inputs.release && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Application version consistency
        run: |
          node scripts/check-version.mjs
      - name: Install Intel runtime build dependencies
        run: |
          brew install glib gettext pcre2 libffi pixman pkgconf meson ninja
          brew upgrade glib gettext pcre2
      # The runtime build is incremental inside _output/intel-runtime. The key
      # names only what changes its compiled files: the build script (with its
      # pinned source hashes), the SDK, the compiler, Python's minor version and
      # the Homebrew packages QEMU links or builds with. Runner image updates
      # that touch nothing else keep the cache.
      - name: Describe the Intel runtime build inputs
        id: runtime-inputs
        run: |
          {
            xcrun --show-sdk-version
            xcrun clang --version | head -n 1
            python3 -c 'import sys; print("python", *sys.version_info[:2])'
            brew list --versions pixman libffi gettext pkgconf meson ninja
          } > "$RUNNER_TEMP/intel-runtime-inputs"
          cat "$RUNNER_TEMP/intel-runtime-inputs"
          printf 'digest=%s\n' "$(shasum -a 256 "$RUNNER_TEMP/intel-runtime-inputs" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Pull requests only read the cache; main saves it. One entry per input
      # set keeps the repository within the 10 GB cache budget.
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.release }}
        id: runtime-cache
        with:
          path: _output/intel-runtime
          key: intel-runtime-${{ hashFiles('scripts/build-intel-macos-runtime.sh') }}-${{ steps.runtime-inputs.outputs.digest }}
      - name: Build the macOS application without release credentials
        env:
          CAGE_SIGNING_IDENTITY: '-'
          CAGE_BUILD_PYTHON: python3
          CAGE_BUILD_JOBS: '4'
        run: bash scripts/build-app.sh
      - name: Save the Intel runtime build cache from main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: _output/intel-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Workbench checks
        run: |
          npm run --prefix ui lint
          npm test --prefix ui
          node --test internal/cage/clipboard.test.cjs internal/cage/browser-audit.test.mjs internal/cage/browser-downloads.test.mjs internal/cage/browser-uploads.test.mjs internal/cage/browser-login.test.mjs internal/cage/browser-clipboard.test.mjs internal/cage/browser-visibility.test.mjs internal/cage/native-input.test.mjs internal/cage/display-density.test.mjs internal/cage/browser-wheel.test.mjs scripts/build-intel-macos-runtime.test.mjs
          uv run internal/cage/claude-account.test.py
          uv run internal/cage/display-governor.test.py
          uv run internal/cage/save-download.test.py
          uv run internal/cage/editor-migrate.test.py
          uv run --no-project internal/workbench/cache_maintenance_test.py
      - name: Go tests and vet
        run: |
          # Intel 上 Lima 使用 QEMU 驱动；与 internal/host/runtime_darwin_amd64.go 一致，使用随包构建的 QEMU
          runtime="$PWD/_output/Cage.app/Contents/Resources/intel-macos/runtime/bin"
          test -x "$runtime/qemu-system-x86_64"
          export PATH="$runtime:$PATH"
          make test-go
          # The race detector run of these packages is done once, on Apple
          # Silicon (macos-build.yml); they have no amd64-only source files.
          go vet ./cmd/cage ./internal/cage ./internal/managedproxy ./internal/workbench
      - name: Native application updater
        run: bash scripts/test-app-updates.sh
      - name: External Agent CLI with an isolated profile
        run: node scripts/agent-cli-smoke.mjs "$PWD/_output/Cage.app/Contents/Resources/cage"
      - name: Native account credential status
        run: bash scripts/test-account-device.sh
      - name: Intel QEMU, guest architecture, networking and shared files
        run: go test github.com/lima-vm/lima/v2/pkg/driver/qemu github.com/lima-vm/lima/v2/pkg/limatype github.com/lima-vm/lima/v2/pkg/limayaml github.com/containers/gvisor-tap-vsock/pkg/services/dns github.com/lima-vm/lima/v2/pkg/hostagent/dns github.com/lima-vm/lima/v2/pkg/networks/usernet github.com/lima-vm/sshocker/pkg/reversesshfs
      - name: Dependency licenses
        run: bash scripts/licenses --check
      - name: Verify the application bundle
        run: |
          codesign --verify --deep --strict _output/Cage.app
          _output/Cage.app/Contents/Resources/cage --help
          _output/Cage.app/Contents/Resources/mihomo -v
          for executable in Contents/MacOS/Cage Contents/Resources/cage Contents/Resources/mihomo Contents/Resources/intel-macos/runtime/bin/qemu-system-x86_64 Contents/Resources/intel-macos/runtime/bin/qemu-img; do
            [[ "$(lipo -archs "_output/Cage.app/$executable")" == x86_64 ]]
          done
          runtime=_output/Cage.app/Contents/Resources/intel-macos/runtime
          "$runtime/bin/qemu-system-x86_64" --version
          "$runtime/bin/qemu-system-x86_64" -accel help | grep -Fx hvf
          "$runtime/bin/qemu-img" --version
          for firmware in linuxboot_dma.bin multiboot_dma.bin pvh.bin; do
            test -s "$runtime/share/qemu/$firmware"
          done
      - name: Archive a complete development App with executable permissions
        if: ${{ !inputs.release }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p _output/ci-macos-test
          archive="$PWD/_output/ci-macos-test/Cage-$version-macos-amd64-test.tar.gz"
          tar -czf "$archive" -C _output Cage.app
          check=$(mktemp -d "$RUNNER_TEMP/cage-app-archive.XXXXXX")
          trap 'rm -rf "$check"' EXIT
          tar -xzf "$archive" -C "$check"
          codesign --verify --deep --strict "$check/Cage.app"
          for executable in Contents/MacOS/Cage Contents/Resources/cage Contents/Resources/mihomo Contents/Resources/CageUpdateInstaller Contents/Resources/intel-macos/runtime/bin/qemu-system-x86_64 Contents/Resources/intel-macos/runtime/bin/qemu-img; do
            test -x "$check/Cage.app/$executable"
          done
          (cd _output/ci-macos-test && shasum -a 256 "${archive##*/}" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/ci-macos-test/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  # Same signing, notarization and staging as the Apple Silicon release job.
  # The Intel App is built natively because it carries the QEMU runtime.
  release:
    if: ${{ inputs.release && github.event_name == 'workflow_dispatch' }}
    needs: checks
    runs-on: macos-15-intel
    environment: cage-release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the exact source and Intel runner
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]
      # A release build restores no cache another branch or workflow wrote;
      # the QEMU runtime is compiled from its pinned sources in this job.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Intel runtime build dependencies
        run: |
          brew install glib gettext pcre2 libffi pixman pkgconf meson ninja
          brew upgrade glib gettext pcre2
      - name: Build, sign, notarize and verify using a temporary keychain
        env:
          CAGE_BUILD_PYTHON: python3
          CAGE_BUILD_JOBS: '4'
          CAGE_MACOS_P12_BASE64: ${{ secrets.CAGE_MACOS_P12_BASE64 }}
          CAGE_MACOS_P12_PASSWORD: ${{ secrets.CAGE_MACOS_P12_PASSWORD }}
          CAGE_MACOS_SIGNING_IDENTITY: ${{ secrets.CAGE_MACOS_SIGNING_IDENTITY }}
          CAGE_MACOS_NOTARY_KEY_BASE64: ${{ secrets.CAGE_MACOS_NOTARY_KEY_BASE64 }}
          CAGE_MACOS_NOTARY_KEY_ID: ${{ secrets.CAGE_MACOS_NOTARY_KEY_ID }}
          CAGE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CAGE_MACOS_NOTARY_ISSUER_ID }}
          CAGE_MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.CAGE_MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ci-macos-signing.sh run
      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: bash scripts/ci-macos-signing.sh cleanup
      - name: Stage only public release files
        run: |
          version=$(tr -d '\r\n' < VERSION)
          source_version=$(sed -n 's/^version=//p' scripts/fetch-proxy-core.sh)
          release="$PWD/_output/releases/$version"
          node scripts/release-version.mjs metadata macos-intel "$release/build-metadata.json"
          mkdir -p _output/ci-macos-release
          # The Apple Silicon job publishes the same pinned Mihomo source.
          # Publishing one copy avoids two downloads of a generated archive.
          test -s "$release/mihomo-$source_version-source.tar.gz"
          cp "$release/Cage-$version-macos-amd64.dmg" "$release/build-metadata.json" _output/ci-macos-release/
          grep -E "^[0-9a-f]{64}  Cage-$version-macos-amd64\.dmg$" "$release/SHA256SUMS" > _output/ci-macos-release/SHA256SUMS
          (cd _output/ci-macos-release && shasum -a 256 --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/ci-macos-release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
