name: Three-platform checks and test packages
on:
  # The website and user guides have their own workflow (www.yml) and are in
  # no package, so changes limited to them skip the three-platform builds.
  push:
    branches: ['**', '!codex/release/**']
    paths-ignore: ['README*.md', 'www/**', 'docs/guide/**', 'docs/releases/**']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cage-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Version consistency and release safety tests
        run: |
          node scripts/check-repository-files.mjs
          node scripts/check-version.mjs
          node --test scripts/release-version.test.mjs scripts/release-control.test.mjs scripts/prepare-release-assets.test.mjs scripts/esigner.test.mjs scripts/contribution-invite.test.mjs scripts/issue-system-labels.test.mjs
          pwsh -NoProfile -File scripts/test-windows-signing.ps1
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
      - name: Guest creation preference contracts
        run: node scripts/guest-os/tests/browser-profile.test.mjs
  macos:
    needs: workflow-checks
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: cage-macos-arm64-test
  windows-updates:
    needs: workflow-checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["windows-2025", "windows-2022"]' || '["windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Install the verified NSIS compiler
        run: ./scripts/install-nsis.ps1
      - name: Install the verified WebView2 prerequisite
        run: |
          . ./scripts/windows-common.ps1
          $dependency = (Get-Content packaging/windows/dependencies.json -Raw | ConvertFrom-Json).webview2
          $cache = Join-Path $env:RUNNER_TEMP 'update-dependencies'
          $runtime = Get-VerifiedDependency $dependency $cache
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 prerequisite signature is not trusted.' }
          $start = [Diagnostics.ProcessStartInfo]::new($runtime)
          $start.UseShellExecute = $false
          $start.WorkingDirectory = $cache
          $start.ArgumentList.Add('/silent'); $start.ArgumentList.Add('/install')
          $process = [Diagnostics.Process]::Start($start)
          try {
            if (!$process.WaitForExit(180000)) { $process.Kill($true); throw 'WebView2 prerequisite installation timed out.' }
            if ($process.ExitCode -ne 0) { throw "WebView2 prerequisite failed: $($process.ExitCode)" }
          } finally { $process.Dispose() }
      - name: Verify signed update, rejection and rollback transactions
        run: ./scripts/test-windows-update-flow.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-${{ matrix.os }}-reports
          path: ${{ runner.temp }}/cage-smoke-update-*.json
          if-no-files-found: ignore
  windows:
    needs: workflow-checks
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: cage-windows-amd64-test
      all_windows_versions: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
  linux:
    needs: workflow-checks
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: cage-linux-amd64-test
